<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIAS | Mapa de Bienes Institucionales · Mobile Enterprise</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-color: #176b4d;
            --secondary-color: #20966c;
            --fias-color: #1f6feb;
            --enterprise-navy: #0b1f33;
            --enterprise-navy-2: #102d49;
            --enterprise-bg: #eef3f7;
            --enterprise-surface: #ffffff;
            --enterprise-surface-alt: #f7f9fb;
            --enterprise-text: #17212b;
            --enterprise-muted: #697788;
            --enterprise-border: #dce4eb;
            --enterprise-border-soft: #e8edf2;
            --enterprise-accent-soft: #e9f6f0;
            --enterprise-blue-soft: #eaf2ff;
            --enterprise-shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 6px 16px rgba(15,23,42,.05);
            --enterprise-shadow: 0 18px 44px rgba(15,23,42,.14);
            --navbar-height: 64px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; margin: 0; }
        html { background: var(--enterprise-navy); }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--enterprise-text);
            background: var(--enterprise-bg);
            font-family: Inter, "Segoe UI Variable", "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 14px;
            letter-spacing: -.005em;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        button, input { font: inherit; }
        button { touch-action: manipulation; }

        /* =========================
           HEADER ENTERPRISE
           ========================= */
        .navbar {
            height: var(--navbar-height);
            min-height: var(--navbar-height);
            flex-shrink: 0;
            padding: 7px 10px 7px max(10px, env(safe-area-inset-left));
            padding-right: max(10px, env(safe-area-inset-right));
            background:
                radial-gradient(circle at 78% -80%, rgba(42,173,119,.32), transparent 43%),
                linear-gradient(110deg, #071827 0%, var(--enterprise-navy) 50%, var(--enterprise-navy-2) 100%);
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 8px 28px rgba(5,18,30,.22);
            z-index: 1100;
            position: relative;
        }

        .navbar::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, #28a778 0%, #76cfaa 44%, transparent 85%);
            opacity: .9;
        }

        .brand-wrap { min-width: 0; gap: 9px; }
        .navbar-brand { margin: 0; padding: 0; min-width: 0; text-decoration: none; }

        .brand-logo-shell {
            width: 96px;
            height: 38px;
            padding: 6px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,.98);
            border: 1px solid rgba(255,255,255,.3);
            box-shadow: 0 5px 15px rgba(0,0,0,.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .brand-logo-shell img { width: 80px; height: 24px; object-fit: contain; }
        .brand-copy { min-width: 0; line-height: 1.05; }
        .brand-eyebrow {
            color: #8ed8b7;
            font-size: .56rem;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .brand-title {
            display: block;
            max-width: 145px;
            margin-top: 3px;
            overflow: hidden;
            color: #fff;
            font-size: .82rem;
            font-weight: 720;
            letter-spacing: -.015em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-actions { gap: 7px; flex-shrink: 0; }

        #reset-filters {
            width: 39px;
            height: 39px;
            padding: 0 !important;
            margin: 0 !important;
            border: 1px solid rgba(255,255,255,.20);
            border-radius: 11px;
            background: rgba(255,255,255,.08);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: none;
        }
        #reset-filters:active { background: rgba(255,255,255,.17); transform: scale(.97); }

        .fias-switch {
            min-height: 39px;
            margin: 0;
            padding: 7px 9px 7px 37px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 11px;
            background: rgba(255,255,255,.06);
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .fias-switch .form-check-input {
            width: 2em;
            height: 1.08em;
            margin: 0 0 0 -28px;
            border-color: rgba(255,255,255,.42);
            background-color: rgba(255,255,255,.17);
            cursor: pointer;
        }
        .fias-switch .form-check-input:checked { background-color: #34b783; border-color: #34b783; }
        .fias-switch .form-check-input:focus { box-shadow: 0 0 0 .18rem rgba(52,183,131,.17); }
        .fias-switch .form-check-label {
            margin-left: 7px;
            color: #fff;
            font-size: .68rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* =========================
           MAPA Y DRAWER
           ========================= */
        #map-container {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
            height: calc(100vh - var(--navbar-height));
            height: calc(100dvh - var(--navbar-height));
            overflow: hidden;
            background: #dfe7ed;
        }

        #map-wrapper { flex: 1; position: relative; width: 100%; height: 100%; min-width: 0; }
        #map { width: 100%; height: 100%; z-index: 1; background: #e7edf2; }

        #sidebar {
            width: 400px;
            min-width: 400px;
            height: 100%;
            position: relative;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f3f6f9;
            border-right: 1px solid var(--enterprise-border);
            box-shadow: 12px 0 34px rgba(15,23,42,.11);
            transition: width .28s cubic-bezier(.2,.8,.2,1), min-width .28s cubic-bezier(.2,.8,.2,1), transform .28s cubic-bezier(.2,.8,.2,1);
        }

        .sidebar-header {
            flex: 0 0 auto;
            padding: 14px 13px 12px;
            background: rgba(255,255,255,.98);
            border-bottom: 1px solid var(--enterprise-border-soft);
            box-shadow: 0 3px 12px rgba(15,23,42,.035);
            z-index: 3;
        }

        .sidebar-heading {
            margin: 0 0 9px 2px;
            color: #667587;
            font-size: .66rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .sidebar-heading i { margin-right: 6px; color: var(--primary-color); }

        .search-row { display: flex; gap: 8px; align-items: center; }
        .search-shell { position: relative; flex: 1; min-width: 0; }
        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            z-index: 2;
            transform: translateY(-50%);
            color: #7c8998;
            pointer-events: none;
        }
        #search-input {
            height: 45px;
            padding: .65rem .9rem .65rem 39px;
            border: 1px solid #d5dee7;
            border-radius: 11px;
            background: #f8fafc;
            color: var(--enterprise-text);
            font-size: .87rem;
            box-shadow: inset 0 1px 1px rgba(15,23,42,.02);
        }
        #search-input::placeholder { color: #94a0ad; }
        #search-input:focus {
            border-color: #6bb895;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(32,150,108,.12);
        }

        #close-sidebar-mobile {
            width: 45px;
            height: 45px;
            padding: 0;
            margin: 0 !important;
            border: 1px solid #dce4eb;
            border-radius: 11px;
            background: #f4f7f9;
            color: #536171;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex: 0 0 auto;
        }
        #close-sidebar-mobile:active { background: #e9eef3; transform: scale(.97); }

        .sidebar-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 9px calc(18px + env(safe-area-inset-bottom));
            background: #f3f6f9;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: #bdc9d4 transparent;
        }
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #bdc9d4; border-radius: 10px; }

        .filter-section {
            margin: 7px 0;
            padding: 12px;
            border: 1px solid var(--enterprise-border-soft);
            border-radius: var(--radius-lg);
            background: var(--enterprise-surface);
            box-shadow: var(--enterprise-shadow-sm);
        }

        .filter-section h6 {
            min-height: 27px;
            margin: 0 0 8px !important;
            color: #243244 !important;
            font-size: .78rem !important;
            font-weight: 750 !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .filter-title { display: inline-flex; align-items: center; min-width: 0; }
        .filter-title i {
            width: 25px;
            height: 25px;
            margin-right: 8px;
            border-radius: 7px;
            background: var(--enterprise-accent-soft);
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            flex: 0 0 auto;
        }
        .filter-count {
            min-width: 26px;
            padding: .28rem .42rem;
            border-radius: 8px;
            background: #edf2f6;
            color: #526171;
            font-size: .68rem;
            font-weight: 800;
            text-align: center;
        }

        .filter-options {
            max-height: 145px;
            overflow-y: auto;
            padding: 1px 2px 1px 0;
            scrollbar-width: thin;
        }
        .filter-option.form-check {
            min-height: 38px;
            margin: 0 0 3px;
            padding: 7px 7px 7px 31px;
            border: 1px solid transparent;
            border-radius: 9px;
            display: flex;
            align-items: center;
        }
        .filter-option .form-check-input {
            width: 16px;
            height: 16px;
            margin: 0 0 0 -24px;
            border-color: #b9c5d0;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .filter-option .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        .filter-option .form-check-input:focus { box-shadow: 0 0 0 .18rem rgba(23,107,77,.11); }
        .filter-option .form-check-label {
            width: 100%;
            margin: 0 0 0 9px;
            color: #405063;
            font-size: .78rem;
            line-height: 1.25;
            cursor: pointer;
        }

        .results-bar {
            min-height: 44px;
            margin: 9px 1px 8px !important;
            padding: 7px 7px 7px 4px !important;
            border: 0 !important;
            border-bottom: 1px solid #dce4eb !important;
        }
        .results-label {
            display: inline-flex;
            align-items: center;
            color: #2c3b4c;
            font-size: .76rem;
            font-weight: 780;
            letter-spacing: .01em;
        }
        .results-label i {
            width: 28px;
            height: 28px;
            margin-right: 8px;
            border-radius: 8px;
            background: var(--enterprise-accent-soft);
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #results-count {
            min-width: 32px;
            padding: .36rem .54rem;
            border-radius: 9px;
            background: #26394d !important;
            color: #fff;
            font-size: .7rem;
            font-weight: 750;
        }

        .area-card {
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid var(--enterprise-border-soft) !important;
            border-radius: 13px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(15,23,42,.045);
            cursor: pointer;
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }
        .area-card:active { transform: scale(.992); }
        .area-card.active {
            border-color: rgba(23,107,77,.42) !important;
            border-left: 4px solid var(--primary-color) !important;
            background: #fbfefc;
            box-shadow: 0 8px 20px rgba(23,107,77,.11);
        }
        .area-card-header {
            min-height: 66px;
            padding: 9px 11px;
            border: 0;
            background: linear-gradient(180deg, #fff 0%, #fbfcfd 100%);
            display: flex;
            align-items: center;
        }
        .area-card-img {
            width: 43px;
            height: 43px;
            margin-right: 10px;
            border: 1px solid #dfe6ec;
            border-radius: 11px;
            object-fit: contain;
            background: #fff;
            box-shadow: 0 2px 7px rgba(15,23,42,.06);
            flex: 0 0 auto;
        }
        .area-card-header .fw-bold {
            color: #233143;
            font-size: .82rem;
            font-weight: 720 !important;
            line-height: 1.22;
        }
        .area-card-header .small { margin-top: 3px; color: #768494 !important; font-size: .69rem; line-height: 1.18; }
        .area-card-header > .fa-gem {
            width: 28px;
            height: 28px;
            margin-left: 8px;
            border-radius: 8px;
            background: var(--enterprise-blue-soft);
            color: var(--fias-color) !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .72rem;
            flex: 0 0 auto;
        }

        /* =========================
           CONTROLES DEL MAPA
           ========================= */
        #toggle-sidebar-btn {
            position: absolute;
            top: 12px;
            left: max(12px, env(safe-area-inset-left));
            z-index: 1002;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 1px solid rgba(214,223,231,.95);
            border-radius: 14px;
            background: rgba(255,255,255,.97);
            color: var(--enterprise-navy-2);
            box-shadow: 0 10px 28px rgba(15,23,42,.16);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform .16s ease, background .16s ease;
        }
        #toggle-sidebar-btn:active { transform: scale(.96); background: #f3f6f8; }

        .leaflet-control-zoom {
            margin-right: max(12px, env(safe-area-inset-right)) !important;
            margin-bottom: calc(14px + env(safe-area-inset-bottom)) !important;
            border: 0 !important;
            border-radius: 13px !important;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(15,23,42,.16) !important;
        }
        .leaflet-control-zoom a {
            width: 43px !important;
            height: 43px !important;
            line-height: 43px !important;
            border-color: #e3e9ee !important;
            background: rgba(255,255,255,.97) !important;
            color: #26384c !important;
            font-size: 20px !important;
        }
        .leaflet-control-zoom a:first-child { border-radius: 13px 13px 0 0 !important; }
        .leaflet-control-zoom a:last-child { border-radius: 0 0 13px 13px !important; }

        .custom-map-img {
            width: 38px !important;
            height: 38px !important;
            border: 2px solid #fff;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 4px 10px rgba(15,23,42,.32);
        }
        .fias-marker-pulse { border-color: var(--fias-color) !important; animation: pulse 2.2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(31,111,235,.52), 0 4px 10px rgba(15,23,42,.28); }
            70% { box-shadow: 0 0 0 9px rgba(31,111,235,0), 0 4px 10px rgba(15,23,42,.28); }
            100% { box-shadow: 0 0 0 0 rgba(31,111,235,0), 0 4px 10px rgba(15,23,42,.28); }
        }

        .leaflet-popup-content-wrapper {
            overflow: hidden;
            border: 1px solid rgba(220,228,235,.9);
            border-radius: 15px;
            box-shadow: 0 18px 42px rgba(15,23,42,.18);
        }
        .leaflet-popup-content { margin: 13px; min-width: 200px; }
        .leaflet-popup-content h6 { color: #25364a !important; font-size: .88rem; line-height: 1.25; }
        .leaflet-popup-content .badge { border-radius: 8px; font-size: .67rem; }
        .leaflet-popup-content .btn {
            min-height: 36px;
            border: 0;
            border-radius: 9px;
            font-size: .75rem;
            font-weight: 680;
        }
        .leaflet-popup-content .btn-primary { background: #1d4f7c; }
        .leaflet-popup-content .btn-success { background: var(--primary-color); }
        .leaflet-popup-tip { box-shadow: 3px 3px 8px rgba(15,23,42,.08); }

        /* =========================
           CARGA / SWEETALERT
           ========================= */
        #loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(244,247,249,.96);
            backdrop-filter: blur(7px);
        }
        .loading-brand {
            width: 58px;
            height: 58px;
            margin-bottom: 14px;
            border: 1px solid #dce5ec;
            border-radius: 18px;
            background: #fff;
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--enterprise-shadow-sm);
        }
        #loading-overlay .spinner-border { width: 1.7rem; height: 1.7rem; color: var(--primary-color) !important; border-width: .18em; }
        .loading-copy { margin-top: 11px; color: #586779; font-size: .76rem; font-weight: 650; }

        .swal2-popup { border-radius: 18px !important; padding: 1.15rem !important; }
        .swal2-title { color: #1f2f42 !important; font-size: 1.05rem !important; line-height: 1.25 !important; }
        .swal2-html-container { color: #455468 !important; font-size: .88rem !important; }
        .swal2-confirm { min-height: 40px; border-radius: 10px !important; font-weight: 700 !important; }

        .legend { display: none; }

        /* =========================
           MÓVIL
           ========================= */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: min(92vw, 410px);
                min-width: min(92vw, 410px);
                max-width: 410px;
                height: 100%;
                transform: translateX(0);
                border-right: 1px solid rgba(210,220,229,.96);
                border-radius: 0 18px 18px 0;
                box-shadow: 18px 0 42px rgba(15,23,42,.18);
            }
            #sidebar.collapsed { transform: translateX(calc(-100% - 24px)); }
            #close-sidebar-mobile { display: inline-flex !important; }

            .sidebar-header { padding-top: 13px; }
            .filter-options { max-height: 137px; }

            /* Evita animaciones hover propias de escritorio en touch */
            .area-card:hover { transform: none; box-shadow: 0 2px 8px rgba(15,23,42,.045); }
        }

        /* Teléfonos muy estrechos */
        @media (max-width: 390px) {
            .brand-logo-shell { width: 82px; padding-inline: 6px; }
            .brand-logo-shell img { width: 68px; }
            .brand-title { max-width: 104px; font-size: .76rem; }
            .brand-eyebrow { font-size: .51rem; }
            #reset-filters { width: 37px; height: 37px; }
            .fias-switch { min-height: 37px; padding-right: 7px; }
            .fias-switch .form-check-label { font-size: .63rem; }
        }

        /* Landscape móvil: filtros más densos para no perder altura */
        @media (max-width: 932px) and (orientation: landscape) and (max-height: 500px) {
            :root { --navbar-height: 56px; }
            .navbar { padding-top: 5px; padding-bottom: 5px; }
            .brand-logo-shell { height: 34px; }
            .brand-logo-shell img { height: 21px; }
            #sidebar { width: min(58vw, 390px); min-width: min(58vw, 390px); }
            .sidebar-heading { display: none; }
            .sidebar-header { padding: 8px 10px; }
            #search-input, #close-sidebar-mobile { height: 40px; }
            .filter-section { padding: 9px 10px; margin: 5px 0; }
            .filter-options { max-height: 92px; }
        }

        /* Desktop fallback: mantiene esta versión utilizable si se abre fuera del móvil */
        @media (min-width: 769px) {
            #sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; }
            #sidebar.collapsed .sidebar-header,
            #sidebar.collapsed .sidebar-content { opacity: 0; }
            #close-sidebar-mobile { display: none !important; }
            .area-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15,23,42,.08); }
            .brand-title { max-width: 260px; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark">
        <div class="d-flex align-items-center justify-content-between w-100">
            <a class="navbar-brand d-flex align-items-center brand-wrap" href="#" aria-label="FIAS - Mapa de Bienes Institucionales">
                <span class="brand-logo-shell">
                    <img src="https://fias.org.ec/wp-content/uploads/2021/11/Logo_FIAS_web.png" alt="FIAS">
                </span>
                <span class="brand-copy d-none d-sm-block">
                    <small class="brand-eyebrow">Gestión institucional</small>
                    <strong class="brand-title">Mapa de Bienes</strong>
                </span>
            </a>
            <div class="nav-actions d-flex align-items-center">
                <button class="btn" id="reset-filters" title="Reiniciar filtros" aria-label="Reiniciar filtros">
                    <i class="fas fa-rotate-left"></i>
                </button>
                <div class="form-check form-switch fias-switch">
                    <input class="form-check-input" type="checkbox" id="fias-filter">
                    <label class="form-check-label" for="fias-filter">Solo FIAS</label>

        // Código para detectar vista móvil
        function isMobileView() {
            // El breakpoint debe coincidir con el del CSS (@media max-width: 768px)
            return window.innerWidth <= 768; 
        }
        
        // --- LÓGICA DE INICIALIZACIÓN BLINDADA ---
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('loading-overlay');
            
            // Failsafe: Quitar pantalla de carga después de 3 seg pase lo que pase
            setTimeout(() => { if(overlay) overlay.style.display = 'none'; }, 3000);

            try {
                // Preparar Datos
                areasProtegidas.forEach(area => area.tieneBienesFIAS = esLinkValido(area.link));
                areasAdministrativas.forEach(area => area.tieneBienesFIAS = true);
                const todasLasAreas = [...areasProtegidas, ...areasAdministrativas];

                // Comprobar móvil y configurar sidebar inicial
                if (isMobileView()) {
                    // CERRADO en móvil
                    document.getElementById('sidebar').classList.add('collapsed');
                    document.getElementById('close-sidebar-mobile').style.display = 'block'; // Mostrar botón de cierre
                } else {
                    // ABIERTO en escritorio
                    document.getElementById('sidebar').classList.remove('collapsed');
                    document.getElementById('close-sidebar-mobile').style.display = 'none'; // Ocultar botón de cierre
                }

                // INICIO DEL MAPA Y AJUSTE DE VISTA
                const mapOptions = { zoomControl: false, attributionControl: false };
                
                // El zoom inicial depende de si es móvil o escritorio
                const initialZoom = isMobileView() ? 5 : 7;

                map = L.map('map', mapOptions).setView([-1.83, -78.18], initialZoom);
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // Capas
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                markersLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
                map.addLayer(markersLayer);

                // Procesar Datos para Mapa
                areaData = todasLasAreas.map(area => {
                    const iconHtml = `<img src="${area.logoUrl}" class="custom-map-img ${area.tieneBienesFIAS ? 'fias-marker-pulse' : ''}" onerror="this.src='${DEFAULT_IMG}'">`;
                    const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -20] });
                    const marker = L.marker([area.latitud, area.longitud], { icon: icon });
                    
                    const popupContent = `<div class="text-center p-2">
                        <h6 class="mb-1 text-primary fw-bold">${area.nombre}</h6>
                        <span class="badge bg-light text-dark mb-2 border">${area.tipo}</span>
                        ${area.tieneBienesFIAS ? '<br><small class="text-success fw-bold"><i class="fas fa-check"></i> Inventario Disponible</small>' : ''}
                        <div class="mt-2">
                            <button class="btn btn-sm btn-primary w-100 mb-1" onclick="viewDetails(${area.id})">Detalles</button>
                            ${area.tieneBienesFIAS && esLinkValido(area.link) ? `<button class="btn btn-sm btn-success w-100" onclick="window.open('${area.link}', '_blank', 'noopener')">Ver Inventario</button>` : ''}
                        </div>
                    </div>`;
                    
                    marker.bindPopup(popupContent, { minWidth: 200 });
                    marker.on('click', () => {
                        highlightCard(area.id);
                        if (!isMobileView()) {
                            // Solo para escritorio: desplazar la tarjeta para que sea visible
                            const card = document.querySelector(`.area-card[data-id='${area.id}']`);
                            if(card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    });

                    return { ...area, marker };
                });

                // Crear Filtros
                createFilters(areasProtegidas, areasAdministrativas, todasLasAreas);
                
                // Renderizar
                updateMapAndList();
                setTimeout(() => { if (map) { map.invalidateSize(true); fitFilteredBounds(areaData, true); } }, 250);
                
                // Event Listeners
                setupListeners(areasProtegidas, areasAdministrativas, todasLasAreas);

                // ÉXITO: Quitar pantalla de carga inmediatamente
                overlay.style.display = 'none';

            } catch (error) {
                console.error("Error crítico inicializando el mapa:", error);
                overlay.innerHTML = `<div class="text-danger text-center p-3"><i class="fas fa-exclamation-triangle fa-2x mb-2"></i><br>Error cargando el mapa.<br>Intente recargar.</div>`;
            }
        });

        // --- FUNCIONES AUXILIARES ---
        function createFilters(prot, admin, all) {
            const types = [...new Set(prot.map(a => a.tipo))].sort();
            const regions = [...new Set(all.map(a => a.region))].sort();
            const adminTypes = [...new Set(admin.map(a => a.subtipo))].sort();

            const renderOpts = (arr, containerId, type) => {
                const container = document.getElementById(containerId);
                // Limpiar filtros antes de renderizar (prevención)
                container.innerHTML = '';
                arr.forEach(val => {
                    const div = document.createElement('div');
                    div.className = 'filter-option form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" id="${type}-${val.replace(/\s/g,'')}" data-type="${type}" data-val="${val}">
                        <label class="form-check-label w-100" for="${type}-${val.replace(/\s/g,'')}">${val}</label>
                    `;
                    div.querySelector('input').addEventListener('change', handleFilterChange);
                    container.appendChild(div);
                });
            };

            renderOpts(types, 'type-options', 'type');
            renderOpts(regions, 'region-options', 'region');
            renderOpts(adminTypes, 'admin-options', 'admin');
        }

        function handleFilterChange(e) {
            const { type, val } = e.target.dataset;
            let target = type === 'type' ? activeFilters.types : (type === 'region' ? activeFilters.regions : activeFilters.adminTypes);
            
            if (e.target.checked) target.push(val);
            else { const idx = target.indexOf(val); if (idx > -1) target.splice(idx, 1); }
            
            updateMapAndList();
        }


        function fitFilteredBounds(filtered, force = false) {
            if (!map || !filtered || filtered.length === 0) return;

            const shouldFit =
                force ||
                document.getElementById('search-input').value.trim() !== '' ||
                document.getElementById('fias-filter').checked ||
                activeFilters.regions.length > 0 ||
                activeFilters.types.length > 0 ||
                activeFilters.adminTypes.length > 0 ||
                !map.__initialBoundsFitted;

            if (!shouldFit) return;

            const bounds = L.featureGroup(filtered.map(i => i.marker)).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds.pad(isMobileView() ? 0.25 : 0.15), {
                    maxZoom: isMobileView() ? 7 : 8,
                    animate: true
                });
                map.__initialBoundsFitted = true;
            }
        }

        function updateMapAndList() {
            markersLayer.clearLayers();
            const cardContainer = document.getElementById('areas-cards');
            cardContainer.innerHTML = '';

            const search = document.getElementById('search-input').value.trim().toLowerCase();
            const fiasOnly = document.getElementById('fias-filter').checked;
            
            const filtered = areaData.filter(item => {
                const matchesSearch = item.nombre.toLowerCase().includes(search);
                const matchesRegion = activeFilters.regions.length === 0 || activeFilters.regions.includes(item.region);
                const matchesFias = !fiasOnly || item.tieneBienesFIAS;
                
                if (!matchesSearch || !matchesRegion || !matchesFias) return false;
                
                // Lógica combinada Tipos + Admin
                const hasTypeFilter = activeFilters.types.length > 0;
                const hasAdminFilter = activeFilters.adminTypes.length > 0;

                if (!hasTypeFilter && !hasAdminFilter) return true;
                
                if (item.esAdministrativa) return hasAdminFilter && activeFilters.adminTypes.includes(item.subtipo);
                return hasTypeFilter && activeFilters.types.includes(item.tipo);
            });

            // Actualizar contadores
            document.getElementById('count-regions').innerText = activeFilters.regions.length;
            document.getElementById('count-types').innerText = activeFilters.types.length;
            document.getElementById('count-admin').innerText = activeFilters.adminTypes.length;
            document.getElementById('results-count').innerText = filtered.length;

            filtered.forEach(item => {
                markersLayer.addLayer(item.marker);
                
                const card = document.createElement('div');
                card.className = `area-card ${item.esAdministrativa ? 'border-start-0 border-end-0' : ''}`;
                card.dataset.id = item.id;
                card.innerHTML = `
                    <div class="area-card-header">
                        <img src="${item.logoUrl}" class="area-card-img" onerror="this.src='${DEFAULT_IMG}'">
                        <div style="flex:1; min-width:0;">
                            <div class="fw-bold text-truncate">${item.nombre}</div>
                            <div class="small text-muted">${item.tipo}</div>
                        </div>
                        ${item.tieneBienesFIAS ? '<i class="fas fa-gem text-primary" title="Bienes FIAS"></i>' : ''}
                    </div>
                `;
                card.addEventListener('click', () => {
                    highlightCard(item.id);
                    item.marker.openPopup();
                    map.setView([item.latitud, item.longitud], 11);
                    
                    // Solo en vista móvil, cerrar el sidebar al seleccionar una tarjeta
                    if (isMobileView()) toggleSidebar(); 
                });
                cardContainer.appendChild(card);
            });

            // Ajustar la vista para que en móvil y escritorio se visualicen correctamente
            // las áreas cargadas, incluidas las nuevas.
            fitFilteredBounds(filtered);
        }

        function highlightCard(id) {
            document.querySelectorAll('.area-card').forEach(c => c.classList.remove('active'));
            const active = document.querySelector(`.area-card[data-id='${id}']`);
            if(active) active.classList.add('active');
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('collapsed');
            
            // Cambiar icono del botón
            const icon = document.querySelector('#toggle-sidebar-btn i');
            // Si está colapsado, mostrar el icono de menú (bars)
            icon.className = sb.classList.contains('collapsed') ? 'fas fa-bars' : 'fas fa-chevron-left';
        }

        function setupListeners() {
            document.getElementById('search-input').addEventListener('input', updateMapAndList);
            document.getElementById('fias-filter').addEventListener('change', updateMapAndList);
            document.getElementById('toggle-sidebar-btn').addEventListener('click', toggleSidebar);
            document.getElementById('close-sidebar-mobile').addEventListener('click', toggleSidebar);
            document.getElementById('reset-filters').addEventListener('click', () => {
                activeFilters = { types: [], regions: [], adminTypes: [], search: '', fiasOnly: false };
                document.getElementById('search-input').value = '';
                document.getElementById('fias-filter').checked = false;
                document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
                updateMapAndList();
            });
            // Agregamos un listener para reajustar si el usuario cambia el tamaño de la ventana (e.g., gira el móvil)
            window.addEventListener('resize', () => {
                // Reajustar mapa a la nueva vista
                if (map) map.invalidateSize(true);
            });
        }

        window.viewDetails = function(id) {
            const item = areaData.find(i => i.id === id);
            if(item) {
                Swal.fire({
                    title: item.nombre,
                    html: `<div class="text-start fs-6">
                        <div class="text-center mb-3"><img src="${item.logoUrl}" style="width:80px; height:80px; object-fit:contain; border-radius:50%; border:1px solid #eee;" onerror="this.src='${DEFAULT_IMG}'"></div>
                        <p><b>Tipo:</b> ${item.tipo}</p>
                        <p><b>Región:</b> ${item.region}</p>
                        ${item.direccion ? `<p><b>Dirección:</b> ${item.direccion}</p>` : ''}
                        ${item.tieneBienesFIAS ? '<p class="text-success fw-bold"><i class="fas fa-check-circle"></i> Inventario Disponible</p>' : ''}
                    </div>`,
                    confirmButtonColor: 'var(--primary-color)'
                });
            }
        };
    </script>
</body>
</html>
